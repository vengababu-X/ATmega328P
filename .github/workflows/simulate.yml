name: VLSI Simulation Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  simulate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Install Icarus Verilog
      run: sudo apt-get update && sudo apt-get install -y iverilog

    - name: Compile All Modules
      # The *.v command ensures the core, top, memory, peripherals, and testbench are all linked
      run: iverilog -o simulation.vvp *.v

    - name: Run Simulation
      run: vvp simulation.vvp
