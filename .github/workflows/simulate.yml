name: Arduino Microcontroller RTL Simulation
on: [push]

jobs:
  simulate-chip:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          
      - name: Compile Microcontroller Logic
        run: |
          iverilog -o chip_sim testbench.v micro_avr_cpu.v gpio_port.v uart_tx.v timer.v
          
      - name: View Real-Time Output
        run: |
          vvp chip_sim
